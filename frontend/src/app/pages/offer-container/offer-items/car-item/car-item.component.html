<mat-card>
  <mat-card-content class="card-content">
    <img [src]="car.image[0].small" alt="{{ car.name }} image" class="card-image" />
    <div class="card-data">
      <mat-card-title class="card-title">{{ car.name }}</mat-card-title>
      <div class="card-details">
        <div class="detail-item">
          <mat-icon svgIcon="road"></mat-icon>
          <span>{{ car.mileage | number }} km</span>
        </div>
        <div class="detail-item">
          <mat-icon>edit_calendar</mat-icon>
          <span>{{ car.productionYear }}</span>
        </div>
        <div class="detail-item">
          <mat-icon svgIcon="engine"></mat-icon>
          <span
            >{{ car.power }} kW ({{
              car.power! * 1.34102 | number : "1.0-0"
            }}
            hp)</span
          >
        </div>
        <div class="detail-item">
          <mat-icon svgIcon="transmission"></mat-icon>
          <span>{{ car.transmission | titlecase }}</span>
        </div>
        <div class="detail-item">
          <mat-icon [svgIcon]="fuelIcon"></mat-icon>
          <span>{{ car.engine | titlecase }}</span>
        </div>
      </div>
      <div class="card-footer">
        <span class="location">
          <mat-icon svgIcon="location-pin"></mat-icon>
          <span class="location-text">{{ car.location }}</span>
        </span>
        <span class="price">€{{ car.price | number }}</span>
      </div>
    </div>
  </mat-card-content>
</mat-card>
