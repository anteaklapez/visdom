<form [formGroup]="filterForm" (ngSubmit)="onSubmit()">
  <!-- CIJENA -->
  <div class="form-container">
    <h2>Cijena (€)</h2>
    <div class="field-container">
      <mat-form-field>
        <mat-label>Od</mat-label>
        <input matInput type="number" formControlName="priceFrom" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Do</mat-label>
        <input matInput type="number" formControlName="priceTo" />
      </mat-form-field>
    </div>
  </div>

  <!-- KILOMETRI -->
  <div class="form-container">
    <h2>Prijeđeni kilometri</h2>
    <div class="field-container">
      <mat-form-field>
        <mat-label>Od</mat-label>
        <input matInput type="number" formControlName="mileageFrom" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Do</mat-label>
        <input matInput type="number" formControlName="mileageTo" />
      </mat-form-field>
    </div>
  </div>

  <!-- GODINA -->
  <div class="form-container">
    <h2>Godina proizvodnje</h2>
    <div class="field-container">
      <mat-form-field>
        <mat-label>Od</mat-label>
        <input
          matInput
          formControlName="yearFrom"
          [matDatepicker]="pickerFrom"
        />
        <mat-datepicker-toggle
          matIconSuffix
          [for]="pickerFrom"
        ></mat-datepicker-toggle>
        <mat-datepicker
          #pickerFrom
          startView="multi-year"
          disabled="false"
          (yearSelected)="onYearFromSelected($event, pickerFrom)"
        ></mat-datepicker>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Do</mat-label>
        <input matInput formControlName="yearTo" [matDatepicker]="pickerTo" />
        <mat-datepicker-toggle
          matIconSuffix
          [for]="pickerTo"
        ></mat-datepicker-toggle>
        <mat-datepicker
          #pickerTo
          startView="multi-year"
          disabled="false"
          (yearSelected)="onYearToSelected($event, pickerTo)"
        ></mat-datepicker>
      </mat-form-field>
    </div>
  </div>
</form>
